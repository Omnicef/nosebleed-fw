;
; Nosebleed build configuration.
;
; T-9.3 moved every ESP32-S3 target to ESP-IDF (CMakeLists.txt + main/ +
; sdkconfig.defaults; seven envs -> tools/idf_build.sh <env>). PlatformIO
; remains ONLY for the host-side render/parser tests — the firmware never
; builds through it again.

[platformio]
default_envs = native
src_dir = src
test_dir = test

; ----------------------------------------------------------------- native --
; Host build of lib/render/ for pixel-parity tests (T-2.6). No framework, no
; Arduino/ESP includes; the purity guard (T-1.6) is what keeps that honest.
[env:native]
platform = native
; Host build sees src/ too (main.cpp's native #else, and the test suite links
; against lib/render). The device-only test envs must not be pulled in.
build_src_filter = +<*> -<envs/>
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_type = debug
build_flags =
    -std=c++17
    -DNATIVE_TEST=1
    ; T-5.2 stress test spins std::thread pairs (writer 50 Hz / reader 30 Hz)
    ; to prove the DataCache has no torn reads.
    -pthread
test_framework = unity
test_filter = test_native
test_ignore = test_embedded
