;
; Nosebleed firmware build configuration. See AGENTS.md for hardware facts and
; PLAN.md T-1.1 / T-1.3 for the task this realises.

[platformio]
default_envs = esp32s3
src_dir = src
test_dir = test

; ---------------------------------------------------------------- esp32s3 --
[env:esp32s3]
; pioarduino tracks Arduino 3.3.x / IDF 5.5.x; upstream espressif32 is stale.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; N16R8 = 16 MB quad flash + 8 MB octal PSRAM. The generic esp32-s3-devkitc-1
; base is N8 / no PSRAM; board_build.flash_size is ignored by this platform, so
; the base board ID silently yields an 8 MB no-PSRAM build (see T-0.1 finding).
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
; Serial on USB-JTAG CDC. Without CDC_ON_BOOT the core routes Serial to UART0
; (pins 43/44, unwired on this devkit) and every println is lost.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -DNO_GFX
; lib/panel is a project lib — PlatformIO's LDF compiles it whenever any
; source textually includes panel.h, so the driver dep lives in the base env,
; not just in paneltest. Unreferenced symbols are gc-sectioned as usual.
lib_deps =
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git
    ; Phase 5 data layer. Pinned to the exact versions the T-0.5 gate proved;
    ; LDF only builds them once a source includes them (espn.cpp, T-5.4).
    bblanchon/ArduinoJson@7.4.3
    ; StreamUtils is not resolvable from the registry under this name/version
    ; (UnknownPackageError); pin the commit the v1.9.2 tag points at — what
    ; the spike proved — by hash so the shallow clone cannot drift.
    https://github.com/bblanchon/ArduinoStreamUtils.git#502aead44a07e6760e5d26f9d34b3cb909dc5924

; ---------------------------------------------------------------- logostest --
; T-3.4/T-3.7 standalone proof: mmap the logos partition, verify heap
; untouched and blob checksums, then (with TRAP_EXPECT) take the deliberate
; FRAME-phase trap. Debug build_type so the Arduino core builds without
; NDEBUG; the assert itself is the explicit NB_LOGOS_ASSERT opt-in.
[env:logostest]
extends = env:esp32s3
build_type = debug
build_flags =
    ${env:esp32s3.build_flags}
    -DNB_LOGOS_TEST=1
    -DNB_LOGOS_ASSERT=1
    -DNB_LOGOS_TRAP_EXPECT=1

; ---------------------------------------------------------------- configtest --
; T-4.2 NVS config-store proof on hardware: absent/garbage/truncated blob →
; defaults (no crash loop), brightness round-trip, then a self-triggered
; esp_restart into a second boot that must read the persisted value back.
[env:configtest]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DNB_CONFIG_TEST=1

; ---------------------------------------------------------------- paneltest --
; T-2.8/T-2.9 panel-seam proof on hardware: lib/panel wrapper over the DMA
; driver (SEENGREAT V2.x pin map), WiFi, then hold-scroll-hold-loop the
; IP+version splash rendered by lib/render. src/secrets.h (gitignored)
; supplies creds. NO_GFX per the driver's no-GFX build used at T-0.2.
[env:paneltest]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DNB_PANEL_TEST=1
    -DNB_VERSION=\"phase2-seam\"

; ---------------------------------------------------------------- httptest --
; T-5.3 transport proof on hardware: WiFi -> SNTP -> DNS-failure retries ->
; TLS GET with byte-count vs Content-Length and internal-heap deltas around
; the session (leak check). src/secrets.h supplies creds.
[env:httptest]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DNB_HTTP_TEST=1

; ---------------------------------------------------------------- cachetest --
; T-5.2 device proof: pinned-task seqlock stress, real Xtensa dual-core.
[env:cachetest]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DNB_CACHE_TEST=1

; ----------------------------------------------------------------- native --
; Host build of lib/render/ for pixel-parity tests (T-2.6). No framework, no
; Arduino/ESP includes; the purity guard (T-1.6) is what keeps that honest.
[env:native]
platform = native
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_type = debug
build_flags =
    -std=c++17
    -DNATIVE_TEST=1
    ; T-5.2 stress test spins std::thread pairs (writer 50 Hz / reader 30 Hz)
    ; to prove the DataCache has no torn reads.
    -pthread
test_framework = unity
test_filter = test_native
test_ignore = test_embedded
