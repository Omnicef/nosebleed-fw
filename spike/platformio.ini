; Phase 0 spike — throwaway. Lives in spike/ so Phase 1 starts from a clean
; tree and the CI skip-guards keep working. No root platformio.ini yet (T-1.1).
[platformio]
default_envs = esp32s3

[env:esp32s3-nopsram]
; Diagnostic: same board but quad-PSRAM libs — OPI PSRAM init fails gracefully
; and the app boots WITHOUT PSRAM. Isolates the silent boot hang to OPI PSRAM init.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.arduino.memory_type = qio_qspi
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7
    https://github.com/bblanchon/ArduinoStreamUtils.git

[env:esp32s3]
; pioarduino tracks Arduino 3.3.x / IDF 5.5.x. Upstream PlatformIO espressif32
; is stale — do not use it.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; N16R8 = 16 MB quad flash + 8 MB OCTAL PSRAM. Use the matching board variant,
; which sets upload.flash_size=16MB, psram_type=opi, -DBOARD_HAS_PSRAM and the
; default_16MB.csv partition table. (The generic esp32-s3-devkitc-1 base board
; is N8 / no PSRAM, and board_build.flash_size is ignored by this platform —
; it reads upload.flash_size — so hand overrides silently produce an 8 MB build.)
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
; Serial lives on the USB-JTAG CDC (the only console this board exposes over
; USB). Without CDC_ON_BOOT the core routes Serial to UART0 (pins 43/44) and
; every println is lost — the whole capture mystery.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; T-0.5: filtered streaming JSON. ArduinoJson MUST be v7 (docs/arduinojson-v7.md).
; StreamUtils provides ReadBufferingStream -- without it deserializeJson() reads
; the 1.4 MB response one byte at a time over TLS and the gate fails for the wrong reason.
lib_deps =
    bblanchon/ArduinoJson@^7
    https://github.com/bblanchon/ArduinoStreamUtils.git

[env:panel]
; T-0.2 panel hello-world throwaway. Same N16R8 board, different main file so
; the committed T-0.5 spike (main.cpp) stays untouched.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNO_GFX
build_src_filter = +<panel_main.cpp> -<main.cpp>
lib_deps =
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git
