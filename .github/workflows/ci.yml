# SPDX-License-Identifier: GPL-3.0-only
#
# Nosebleed CI.
#
# Every step degrades gracefully before the code it checks exists, so this is
# green on a docs-only repo and becomes meaningful as each phase lands.
#
# Not here yet: the Wokwi logic job (T-1.8, needs a WOKWI_CLI_TOKEN secret) and
# the hard memory gate (needs a real threshold from T-0.7 — see `size` below).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- purity --
  # Seconds, no toolchain. Fastest signal that an agent drifted from the
  # architecture rule that makes the Phase 9 IDF conversion cheap.
  purity:
    name: Render-layer purity (T-1.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check_render_purity.sh

  # ---------------------------------------------------------------- native --
  # The render tests. No ESP32 toolchain needed, so this stays fast and is the
  # job that actually catches pixel-parity regressions.
  native:
    name: Render + parser tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-native-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run host tests
        run: |
          if [ ! -f platformio.ini ]; then
            echo "::notice::platformio.ini not present yet — skipping (pre-T-1.1)"
            exit 0
          fi
          if ! grep -q '^\[env:native\]' platformio.ini; then
            echo "::notice::env:native not defined yet — skipping (pre-T-2.6)"
            exit 0
          fi
          pio test -e native

      # Render tests write PNGs. Keeping them as artifacts means a failed
      # pixel-parity check can be eyeballed instead of guessed at.
      - name: Upload render output
        if: always() && hashFiles('test/out/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: render-output
          path: test/out/
          retention-days: 14

  # -------------------------------------------------------------- firmware --
  # Does it compile for the real target? T-9.3 moved this from PlatformIO to
  # ESP-IDF 5.5.5 (Arduino 3.3.11 as a managed component); the whole toolchain
  # ships in the espressif/idf image, so there is no install step.
  # This catches the dominant failure mode for a local model on an unfamiliar
  # platform: a plausible but wrong esp_*/HUB75/ArduinoJson signature.
  firmware:
    name: Build esp32s3
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        run: |
          if [ ! -f CMakeLists.txt ]; then
            echo "::error::CMakeLists.txt missing — IDF project vanished"
            exit 1
          fi
          # GH runs each step in a non-login shell; the image's entrypoint
          # export never applies, so idf.py is not on PATH until we source it.
          . "$IDF_PATH/export.sh"
          tools/idf_build.sh firmware build 2>&1 | tee build.log

      # Static footprint via idf.py size. The DRAM/STATIC columns are the
      # internal-SRAM consumers the AGENTS.md budget tracks; runtime peak
      # stays the job of on-device logging and the T-11.2 soak.
      - name: Memory report
        if: steps.build.outcome == 'success'
        run: |
          . "$IDF_PATH/export.sh"
          {
            echo "### Static footprint (idf.py size)"
            echo '```'
            tools/idf_build.sh firmware size
            echo '```'
            echo "_Static only — excludes runtime heap. See AGENTS.md budget._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
